<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الأدمن — سفراء NextStep AI</title><meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="w"><nav><b><img src="assets/logo.png" alt=""><span class="wm">NextStep <i>AI</i></span> · لوحة الأدمن</b><span><a class="btn s o" href="index.html">← الموقع</a> <button class="btn s d" data-a="out" id="outb" hidden>خروج</button></span></nav></div></header>
<div class="w" id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="mock.js"></script><script src="common.js"></script><script src="bg.js"></script>
<script>
let D,tab="a";const loc=i=>i?new Date(new Date(i)-new Date(i).getTimezoneOffset()*6e4).toISOString().slice(0,16):"";const v=i=>($("#"+i)||{}).value||"",AL="ABCDEFGHJKMNPQRSTUVWXYZ23456789",gen=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>AL[b%AL.length]).join("");
const spent=j=>D.P.filter(x=>x.kind==="interview"&&x.judge===j).reduce((s,x)=>s+x.points,0),nm=id=>(D.A.find(a=>a.id===id)||{}).name||"—";
function login(){$("#outb").hidden=true;$("#app").innerHTML=`<div class="box f" style="max-width:380px;margin:40px auto"><b>🔐 دخول الأدمن</b><input id="em" type="email" placeholder="البريد الإلكتروني"><input id="pw" type="password" placeholder="كلمة المرور"><button class="btn" data-a="in">دخول</button></div>`}
async function panel(){try{D=await load(true)}catch(e){return toast(e.message)}$("#outb").hidden=false;const S=D.S,pend=D.U.filter(x=>x.status==="pending"),o=D.A.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("");let b="";
if(tab==="a")b=`<div class="box f"><b>➕ إضافة سفراء (اسم في كل سطر)</b><textarea id="an" rows="3" placeholder="أحمد ...&#10;سارة ..."></textarea><button class="btn s" data-a="addA">توليد الأرقام والإضافة</button></div><div class="box f"><b>السفراء (${D.A.length}) <button class="btn s o" data-a="csv">⬇️ تصدير CSV</button></b>${D.A.map(a=>`<div class="row"><span><b>${esc(a.name)}</b> ${a.registered?"✅":"⏳"}${a.hidden?" 🙈":""} · ${tot(D.P,a.id)} نقطة<br><small><bdi class="ltr">${esc(a.number)}</bdi> · <code>${esc(a.code)}</code></small></span><span><button class="btn s o" data-a="msg" data-id="${a.id}">رسالة</button> <button class="btn s o" data-a="edA" data-id="${a.id}">تعديل</button> <button class="btn s o" data-a="hide" data-id="${a.id}">${a.hidden?"إظهار":"إخفاء"}</button> <button class="btn s d" data-a="delA" data-id="${a.id}">حذف</button></span></div>`).join("")||"لا سفراء"}</div>`;
if(tab==="r")b=`<div class="box f"><b>✅ تسجيل مستقطَب (راسل صفحة المنصة باسم السفير)</b><div class="f r"><select id="ra">${o}</select><input id="rn" placeholder="اسم الشخص"><input id="rl" dir="ltr" placeholder="https://linkedin.com/in/…"></div><small>يُحتسب كل حساب مرة واحدة فقط، ويُمنع تكراره حتى لو لسفير آخر.</small><button class="btn s" data-a="addR">اعتماد (+${esc(S.rp||10)} نقاط)</button></div><div class="box f"><b>المستقطَبون (${D.R.length})</b>${[...D.R].reverse().map(x=>`<div class="row"><span>${esc(nm(x.ambassador_id))} ← ${esc(x.person_name)} · <a href="${url("https://"+x.linkedin)}" target="_blank" rel="noopener">حسابه</a></span><button class="btn s d" data-a="delR" data-id="${x.id}">×</button></div>`).join("")||"لا أحد بعد"}</div>`;
if(tab==="p")b=`<div class="box f"><b>🎯 منح نقاط</b><div class="f r"><select id="pa">${o}</select><select id="pt">${Object.entries(T).map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select><input id="pp" type="number" min="1" placeholder="النقاط (افتراضي حسب النوع)"><select id="pq">${[1,2,3,4,5].map(q=>`<option value="${q}">سؤال ${q}</option>`).join("")}</select><input id="pn" placeholder="ملاحظة"></div><small>اختر «مقابلة» ثم رقم السؤال: 10 نقاط لكل سؤال، والمجموع 50 للسفير.</small><button class="btn s" data-a="addP">منح</button></div><div class="box f"><b>تقييمات المقابلة (الأسئلة 1–5 والمجموع من 50)</b>${D.A.map(a=>{const q=[1,2,3,4,5].map(n=>{const x=D.P.find(y=>y.kind==="interview"&&y.ambassador_id===a.id&&y.question===n);return x?x.points:"–"});return `<div class="row"><span>${esc(a.name)}</span><span>${q.join(" · ")} = ${D.P.filter(y=>y.kind==="interview"&&y.ambassador_id===a.id).reduce((s,y)=>s+y.points,0)}/50</span></div>`}).join("")}</div><div class="box f"><b>سجل النقاط</b>${[...D.P].reverse().slice(0,50).map(x=>`<div class="row"><span>${esc(nm(x.ambassador_id))} · ${T[x.kind]} +${x.points}</span><button class="btn s d" data-a="delP" data-id="${x.id}">×</button></div>`).join("")||"فارغ"}</div>`;
if(tab==="n")b=`<div class="box f"><b>📣 إعلان جديد</b><input id="nt" placeholder="نص الإعلان" maxlength="200"><button class="btn s" data-a="addN">نشر</button></div><div class="box f"><b>الإعلانات</b>${[...D.N].reverse().map(x=>`<div class="row"><span>${esc(x.text)}</span><button class="btn s d" data-a="delN" data-id="${x.id}">×</button></div>`).join("")||"لا إعلانات"}</div>`;
if(tab==="g")b=`<div class="box f"><b>الإعدادات</b><input id="ct" placeholder="عنوان التحدي" value="${esc(S.ct)}"><textarea id="cd" rows="2" placeholder="وصف التحدي">${esc(S.cd)}</textarea><input id="ce" placeholder="نص موعد الانتهاء" value="${esc(S.ce)}"><label>بداية التحدي</label><input id="start_at" type="datetime-local" value="${loc(S.start_at)}"><label>نهاية التحدي</label><input id="end_at" type="datetime-local" value="${loc(S.end_at)}"><label>نقاط كل مستقطَب معتمد</label><input id="rp" type="number" min="1" value="${esc(S.rp||10)}"><label>الفائزون</label><select id="win"><option value="">مخفي</option><option value="1"${S.win==="1"?" selected":""}>نشر الفائزين (أعلى 3 نقاطاً)</option></select><input id="ig" placeholder="رابط إنستغرام (https://…)" value="${esc(S.ig)}"><textarea id="pz" rows="2" placeholder="التكريم / الجوائز">${esc(S.pz)}</textarea><button class="btn s" data-a="set">حفظ</button></div>`;
$("#app").innerHTML=`<h2>⚙️ التحكم الكامل</h2><div class="seg">${[["a","السفراء"],["r","الاستقطاب ("+D.R.length+")"],["p","النقاط"],["n","الإعلانات"],["g","الإعدادات"]].map(([k,n])=>`<button class="${tab===k?"on":""}" data-a="tab" data-t="${k}">${n}</button>`).join("")}</div>${b}`}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;let r={};
if(a==="in"){r=await sb.auth.signInWithPassword({email:v("em"),password:v("pw")});if(r.error)return toast("بيانات الدخول غير صحيحة");return panel()}
if(a==="out"){await sb.auth.signOut();return login()}
if(a==="tab"){tab=b.dataset.t;return panel()}
if(a==="msg"){const x=D.A.find(y=>y.id===id);return open("https://wa.me/?text="+encodeURIComponent(`مرحباً ${x.name} 👋\nمبروك، أنت سفير NextStep AI 🚀\nرقمك الخاص: ${x.code}\nادخل بوابة السفير وأكمل بياناتك واحصل على بطاقتك:\n${CFG.site}/join.html`))}
if(a==="edA"){const x=D.A.find(y=>y.id===id),n=prompt("الاسم",x.name);if(n===null)return;const t=prompt("التخصص / الجامعة",x.title||"");if(t===null)return;const c=prompt("المدينة",x.city||"");if(c===null)return;r=await sb.from("amb_ambassadors").update({name:n.trim()||x.name,title:t.trim(),city:c.trim()}).eq("id",id)}
if(a==="hide"){const x=D.A.find(y=>y.id===id);r=await sb.from("amb_ambassadors").update({hidden:!x.hidden}).eq("id",id)}
if(a==="csv"){const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"',rows=[["الرقم","الاسم","التخصص","المدينة","النقاط","المستقطبون","المقابلة","الحالة"].map(q).join(",")];D.A.slice().sort((p,z)=>tot(D.P,z.id)-tot(D.P,p.id)).forEach(x=>{const L=D.P.filter(y=>y.ambassador_id===x.id);rows.push([x.number,x.name,x.title,x.city,tot(D.P,x.id),L.filter(y=>y.kind==="ref").length,L.filter(y=>y.kind==="interview").reduce((s,y)=>s+y.points,0),x.hidden?"مخفي":"ظاهر"].map(q).join(","))});const l=document.createElement("a");l.href=URL.createObjectURL(new Blob(["\uFEFF"+rows.join("\n")],{type:"text/csv;charset=utf-8"}));l.download="ambassadors.csv";l.click();return}
if(a==="addA"){const names=v("an").split("\n").map(s=>s.trim()).filter(Boolean);if(!names.length)return toast("اكتب الأسماء");let n=D.A.reduce((m,x)=>Math.max(m,parseInt((x.number||"").split("-").pop())||0),0);r=await sb.from("amb_ambassadors").insert(names.map(name=>({name,number:"NSA-2027-"+String(++n).padStart(3,"0"),code:gen()})))}
if(a==="addP"){const k=v("pt"),p=parseInt(v("pp")||DEF[k]);if(!(p>0)||!v("pa"))return toast("أدخل نقاطاً صحيحة");r=await sb.from("amb_points").insert({ambassador_id:v("pa"),kind:k,points:p,judge:null,question:k==="interview"?+v("pq"):null,note:v("pn").trim()||null})}
if(a==="delA"){if(!confirm("حذف السفير وكل بياناته؟"))return;r=await sb.from("amb_ambassadors").delete().eq("id",id)}
if(a==="addR"){if(!v("rn").trim()||!/^https:\/\//.test(v("rl").trim()))return toast("اكتب الاسم ورابط لينكدإن (https://…)");r=await sb.from("amb_referrals").insert({ambassador_id:v("ra"),person_name:v("rn").trim(),linkedin:v("rl").trim()})}
if(a==="delR")r=await sb.from("amb_referrals").delete().eq("id",id);
if(a==="delP")r=await sb.from("amb_points").delete().eq("id",id);
if(a==="ok"||a==="no")r=await sb.from("amb_submissions").update({status:a==="ok"?"approved":"rejected"}).eq("id",id);
if(a==="addN"){if(!v("nt").trim())return toast("اكتب الإعلان");r=await sb.from("amb_news").insert({text:v("nt").trim()})}
if(a==="delN")r=await sb.from("amb_news").delete().eq("id",id);
if(a==="set")r=await sb.from("amb_settings").upsert(["ct","cd","ce","start_at","end_at","rp","win","ig","pz"].map(k=>({key:k,value:/_at$/.test(k)?(v(k)?new Date(v(k)).toISOString():""):v(k).trim()})));
if(r.error)return toast(r.error.code==="23505"?"هذا الحساب مسجَّل مسبقاً — لا يُحتسب مرتين":r.error.message);toast("تم ✓");panel()});
sb.auth.getSession().then(({data})=>data.session?panel():login());
</script><script src="bg.js"></script></body></html>
