<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سفراء NextStep AI — Ambassadors 2027</title><meta name="description" content="منافسة سفراء NextStep AI: اصنع أثرك وارتقِ إلى القمة. تابع الترتيب والنقاط مباشرة.">
<meta name="theme-color" content="#0B1220"><meta property="og:title" content="سفراء NextStep AI 2027"><meta property="og:description" content="اصنع أثرك، وارتقِ للقمة."><meta property="og:image" content="assets/logo.png">
<link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="w"><nav><b><img src="assets/logo.png" alt=""><span class="wm">NextStep <i>AI</i></span></b><div class="l"><a href="#board">الترتيب</a><a href="#how">كيف تشارك</a><a href="#chal">التحدي</a><a href="#faq">الأسئلة</a></div><div style="display:flex;gap:8px"><a class="btn s" href="join.html">بوابة السفير</a><a class="btn s o" href="admin.html">الأدمن</a></div></nav></div></header>
<div class="w" id="app"><div class="empty">جارٍ التحميل…</div></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="mock.js"></script><script src="common.js"></script>
<script>
let D={A:[],P:[],S:{},U:[],N:[],R:[]},Q="",SO="p",CF="",open=null,first=true;
const fmt=n=>new Intl.NumberFormat("en").format(n),cnt=id=>D.P.filter(x=>x.ambassador_id===id&&x.kind==="ref").length;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
function card(a,i){const p=tot(D.P,a.id),mx=Math.max(1,...D.A.map(x=>tot(D.P,x.id))),L=D.P.filter(x=>x.ambassador_id===a.id),b={};L.forEach(x=>b[x.kind]=(b[x.kind]||0)+x.points);const t=TI(p),sub=[a.title,a.city].filter(Boolean).join(" · ");
return `<div class="amb rv" data-id="${a.id}"><span class="rk">${["🥇","🥈","🥉"][i]||"#"+(i+1)}</span>${a.photo?`<img class="ph" src="${esc(a.photo)}" alt="${esc(a.name)}">`:`<div class="av">${esc((a.name||"؟").trim()[0])}</div>`}<h3>${esc(a.name)}<span class="tier" style="background:${t[1]}">${t[0]}</span></h3>${sub?`<small>${esc(sub)}</small>`:""}<div class="pts">${fmt(p)}<small> نقطة</small></div><div class="bar"><i style="width:${p/mx*100}%"></i></div><div class="chips">${Object.entries(b).map(([k,v])=>`<span>${T[k]} <bdi>${v}</bdi></span>`).join("")}</div>${a.linkedin?`<a href="${url(a.linkedin)}" target="_blank" rel="noopener" style="font-size:.82rem;display:inline-block;margin-top:6px">لينكدإن ↗</a>`:""}${open===a.id?`<div class="led">${L.map(x=>`• ${T[x.kind]} +<bdi>${x.points}</bdi>`).join("<br>")||"لا نقاط بعد"}</div>`:""}</div>`}
function rows(){const r=[...D.A].sort((a,b)=>tot(D.P,b.id)-tot(D.P,a.id)),rk=Object.fromEntries(r.map((a,i)=>[a.id,i]));let f=r.filter(a=>((a.name||"")+" "+(a.title||"")).includes(Q)&&(!CF||a.city===CF));if(SO==="ref")f.sort((a,b)=>cnt(b.id)-cnt(a.id));if(SO==="new")f.sort((a,b)=>D.A.indexOf(b)-D.A.indexOf(a));if(!Q&&!CF&&SO==="p"&&r.length>=3)f=f.slice(3);return f.map(a=>card(a,rk[a.id])).join("")||(D.A.length>=3&&!Q&&!CF?"":"<div class='box empty' style='grid-column:1/-1'>لا توجد نتائج مطابقة.</div>")}
function render(){const S=D.S,di=dayInfo(S),r=[...D.A].sort((a,b)=>tot(D.P,b.id)-tot(D.P,a.id)),tp=r.slice(0,3),pod=tp.length===3?[1,0,2].map(i=>card(tp[i],i)).join(""):"",rp=+S.rp||10,nRef=D.P.filter(x=>x.kind==="ref").length,all=D.P.reduce((s,x)=>s+x.points,0),ig=S.ig;
const soc=`<a class="btn s o" href="${CFG.linkedinPage}" target="_blank" rel="noopener">لينكدإن</a>${ig?`<a class="btn s o" href="${url(ig)}" target="_blank" rel="noopener">إنستغرام</a>`:""}<a class="btn s o" href="${CFG.whatsapp}" target="_blank" rel="noopener">واتساب</a>`;
$("#app").innerHTML=`<section class="hero"><div><span class="tag">NextStep Ambassadors · 2027</span><h1>اصنع أثرك،<br><span class="grad">وارتقِ للقمة</span></h1><p>منافسة بين سفراء <bdi>NextStep AI</bdi> يثبتون فيها حضورهم، ويستقطبون طلاباً جدداً، ويعرّفون الجميع بالمنصة. كل خطوة تُحتسب، وكل اسم له أثر.</p><div class="btns"><a class="btn" href="join.html">🚀 بوابة السفير</a><a class="btn o" href="#board">🏆 شاهد الترتيب</a></div><div class="chipsrow"><span>🔗 الاحتساب عبر رسالة لينكدإن</span><span>⏱️ عدّاد مباشر</span><span>🎖️ أوسمة وبطاقات مشاركة</span></div></div>
<div class="scene" id="scene"><div class="pl"><div class="ring r1"><i></i></div><div class="ring r2"><i></i></div><div class="ring r3"><i></i></div></div><img class="logo3d" src="assets/logo.png" alt="NextStep AI"><div class="fc a">🏆 المركز الأول</div><div class="fc b">🔗 رسالة = نقاط</div><div class="fc c">🚀 <bdi>NextStep</bdi></div></div></section>
<div id="cdw">${cdHTML(S)}</div><div class="rule">📌 قاعدة الاحتساب: تُحتسب فقط الأسماء التي تراسل حساب المنصة على لينكدإن باسم السفير، والمتابعة وحدها لا تكفي.</div>
${D.N.length?`<div class="news">📣 ${esc(D.N[D.N.length-1].text)}${D.N.slice(-4,-1).reverse().map(n=>`<small>• ${esc(n.text)}</small>`).join("")}</div>`:""}
<div class="stats"><div class="stat rv"><b data-count="${D.A.length}">0</b><small>سفير مشارك</small></div><div class="stat rv"><b data-count="${all}">0</b><small>نقطة موزّعة</small></div><div class="stat rv"><b data-count="${nRef}">0</b><small>عضو مستقطَب</small></div><div class="stat rv"><b>${di.t}</b><small>${di.s}</small></div></div>
${S.win==="1"&&r.length?`<h2>🎉 الفائزون في التحدي</h2><div class="pod">${[1,0,2].filter(i=>r[i]).map(i=>card(r[i],i)).join("")}</div>`:""}
<h2 id="board">🏆 لوحة المتصدرين</h2><p class="sub">يتحدّث الترتيب لحظياً مع كل نقطة معتمدة. اضغط على أي بطاقة لعرض سجل النقاط.</p>
${pod?`<div class="pod">${pod}</div>`:""}<div class="tools"><input id="q" placeholder="🔍 ابحث عن سفير…" value="${esc(Q)}"><select id="so"><option value="p"${SO==="p"?" selected":""}>الأعلى نقاطاً</option><option value="ref"${SO==="ref"?" selected":""}>الأكثر استقطاباً</option><option value="new"${SO==="new"?" selected":""}>الأحدث انضماماً</option></select><select id="cf"><option value="">كل المدن</option>${[...new Set(D.A.map(a=>a.city).filter(Boolean))].map(c=>`<option${CF===c?" selected":""}>${esc(c)}</option>`).join("")}</select></div>
${D.A.length?"":`<div class="box empty">سيظهر السفراء هنا فور اعتمادهم من الإدارة.</div>`}<div class="list" id="rows">${rows()}</div>
<h2 id="how">كيف تشارك وتجمع النقاط؟</h2><p class="sub">أربع خطوات من الانضمام حتى القمة.</p>
<div class="steps"><div class="box step rv"><b>احصل على رقمك الخاص</b><small>يرسله لك فريق <bdi>NextStep AI</bdi> بعد اعتمادك سفيراً.</small></div><div class="box step rv"><b>أكمل ملفك وحمّل بطاقتك</b><small>أضف صورتك وبياناتك، ثم انشر بطاقة المشاركة على إنستغرام ولينكدإن.</small></div><div class="box step rv"><b>ادعُ الطلاب</b><small>انسخ رسالتك الجاهزة وشاركها مع كل طالب يبحث عن خطوته القادمة.</small></div><div class="box step rv"><b>يراسلون المنصة باسمك</b><small>حين يراسل الشخص صفحة المنصة على لينكدإن ويذكر اسمك أو رقمك، تُسجَّل لك النقاط.</small></div></div>
<div class="grid" style="margin-top:26px"><div class="box rv"><span class="pill"><bdi>50</bdi> نقطة</span><b>المقابلة</b><small>خمسة أسئلة، عشر نقاط لكل سؤال، تُدخلها الإدارة بعد المقابلة.</small></div><div class="box rv"><span class="pill"><bdi dir="ltr">+${rp}</bdi></span><b>استقطاب عضو</b><small>كل شخص يراسل صفحة المنصة باسمك يُحتسب مرة واحدة فقط بعد التحقق من رسالته.</small></div><div class="box rv"><span class="pill">مكافآت</span><b>تحديات الإدارة</b><small>نقاط إضافية من تحديات الأسبوع والمكافآت الخاصة.</small></div></div>
<h2 id="chal">🚀 تحدي الأسبوع</h2><div class="chal rv"><b style="font-size:1.25rem">${esc(S.ct||"يُعلن بداية الأسبوع القادم")}</b><p>${esc(S.cd||"استعدّوا… التحدي فرصتكم الأكبر لقلب الترتيب.")}</p>${S.ce?`<p style="margin-top:8px">ينتهي: ${esc(S.ce)}</p>`:""}</div>
<h2>🎖️ الأوسمة</h2><p class="sub">يظهر وسامك تلقائياً على بطاقتك عند بلوغ النقاط المطلوبة.</p><div class="grid">${[["برونزي","0+","#b87333"],["فضي","20+","#8a97ad"],["ذهبي","40+","#e0a800"],["ماسي","60+","#35b8f5"]].map(t=>`<div class="box rv"><span class="pill" style="background:${t[2]}"><bdi dir="ltr">${t[1]}</bdi></span><b>${t[0]}</b><small>وسام ${t[0]} لمن يبلغ ${t[1].replace("+","")} نقطة فأكثر.</small></div>`).join("")}</div>
${S.pz?`<h2>🎁 التكريم</h2><div class="box rv">${esc(S.pz)}</div>`:""}
<h2 id="faq">❓ أسئلة شائعة</h2><details><summary>كيف أصبح سفيراً؟</summary><p>يُضاف السفراء من فريق <bdi>NextStep AI</bdi> بعد المقابلة، ويستلم كل سفير رقماً خاصاً للدخول إلى بوابته.</p></details><details><summary>كيف أحصل على بطاقتي؟</summary><p>ادخل بوابة السفير برقمك الخاص، أكمل بياناتك وأضف صورتك، ثم حمّل بطاقة المشاركة وانشرها على إنستغرام ولينكدإن.</p></details><details><summary>كيف يُحتسب العضو المستقطَب؟</summary><p>يراسل الشخص صفحة <bdi>NextStep AI</bdi> على لينكدإن ويذكر اسمك أو رقمك. يتحقق الفريق من الرسالة ثم يسجّله باسمك، ولا يُحتسب الحساب مرتين.</p></details><details><summary>كيف تُحسب نقاطي؟</summary><p>من تقييم المقابلة (من 50)، ومن كل شخص يراسل صفحة المنصة باسمك، ومن مكافآت الإدارة.</p></details><details><summary>هل تظهر تفاصيل تقييمي للجميع؟</summary><p>لا. يظهر للجمهور المجموع والترتيب والأوسمة فقط، أما تفاصيل المقابلة فتبقى لدى الإدارة.</p></details>
<div class="box founder rv" style="margin-top:44px"><img src="assets/ahmed.jpg" alt="م. أحمد الحايك"><div><span class="tag">FOUNDER</span><h3 style="font-size:1.35rem;margin:6px 0 0">م. أحمد الحايك</h3><small style="color:var(--mut)">مؤسس <bdi>NextStep AI</bdi> · مهندس ذكاء اصطناعي</small><p style="color:var(--mut);margin:8px 0">نبني تجربة تساعد الطلاب على اتخاذ خطواتهم القادمة بوعي، ونصنع مجتمعاً يقود التغيير.</p><div class="btns" style="margin-top:8px"><a class="btn s" href="${CFG.linkedinMe}" target="_blank" rel="noopener">لينكدإن الشخصي</a>${soc}</div></div></div>
<div class="cta rv"><b style="font-size:1.35rem">جاهز لتصنع أثرك؟</b><p style="opacity:.9">ادخل بوابتك وابدأ رحلتك نحو القمة.</p><a class="btn" href="join.html">🚀 بوابة السفير</a><a class="btn" href="${CFG.linkedinPage}" target="_blank" rel="noopener">تابع لينكدإن</a></div>
<div class="foot">© 2027 <bdi>NextStep AI</bdi> · اصنع أثراً يُرى</div>`;fx()}
function fx(){document.querySelectorAll(".rv:not(.in)").forEach(e=>first?io.observe(e):e.classList.add("in"));document.querySelectorAll("[data-count]").forEach(e=>{const n=+e.dataset.count;if(!first){e.textContent=fmt(n);return}const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/1200);e.textContent=fmt(Math.round(n*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(s)})(t0)});first=false}
document.addEventListener("click",e=>{const c=e.target.closest(".amb[data-id]");if(c&&!e.target.closest("a")){open=open===c.dataset.id?null:c.dataset.id;render()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){Q=e.target.value;$("#rows").innerHTML=rows();fx()}});
document.addEventListener("change",e=>{if(e.target.id==="so"){SO=e.target.value;$("#rows").innerHTML=rows();fx()}if(e.target.id==="cf"){CF=e.target.value;$("#rows").innerHTML=rows();fx()}});
document.addEventListener("mousemove",e=>{const s=document.querySelector("#scene .pl");if(s){s.style.setProperty("--sx",(e.clientX/innerWidth-.5)*30+"deg");s.style.setProperty("--sy",(e.clientY/innerHeight-.5)*-14+"deg")}const c=e.target.closest&&e.target.closest(".amb");document.querySelectorAll(".amb").forEach(x=>{if(x===c){const r=x.getBoundingClientRect();x.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*10+"deg");x.style.setProperty("--rx",-((e.clientY-r.top)/r.height-.5)*10+"deg")}else{x.style.setProperty("--ry","0deg");x.style.setProperty("--rx","0deg")}})});
async function refresh(){try{D=await load();render()}catch(e){$("#app").innerHTML=`<div class="box empty" style="margin:40px 0"><b>⚠️ تعذّر الاتصال بقاعدة البيانات</b><small>تأكد من config.js ومن تشغيل schema.sql. ${esc(e.message||"")}</small></div>`}}
setInterval(()=>{const e=$("#cdw");if(e)e.innerHTML=cdHTML(D.S)},1000);refresh();sb.channel("amb").on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(window._r);window._r=setTimeout(refresh,600)}).subscribe();
</script><script src="bg.js"></script></body></html>
