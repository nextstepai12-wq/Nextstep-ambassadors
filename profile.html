<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملف السفير — NextStep AI</title><meta name="theme-color" content="#0B1220"><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="w"><nav><b><img src="assets/logo.png" alt=""><span class="wm">NextStep <i>AI</i></span></b><div class="l"><a href="index.html">الترتيب</a><a href="join.html">بوابة السفير</a></div><a class="btn s" href="index.html">← كل السفراء</a></nav></div></header>
<div class="w" id="app"><div class="empty">جارٍ التحميل…</div></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="mock.js"></script><script src="common.js"></script><script src="bg.js"></script>
<script>
const NUM=new URLSearchParams(location.search).get("n")||window.__N||"",fmt=n=>new Intl.NumberFormat("en").format(n);let A=null,LINK="";
async function init(){let D;try{D=await load()}catch(e){$("#app").innerHTML=`<div class="box empty">تعذّر الاتصال بقاعدة البيانات.</div>`;return}
const r=[...D.A].sort((a,b)=>tot(D.P,b.id)-tot(D.P,a.id)),i=r.findIndex(a=>a.number===NUM),a=r[i];
if(!a){$("#app").innerHTML=`<div class="box empty" style="margin-top:40px"><b>لم يُعثر على هذا السفير</b><br><a href="index.html">العودة إلى لوحة الترتيب</a></div>`;return}
A=a;const p=tot(D.P,a.id),L=D.P.filter(x=>x.ambassador_id===a.id),iv=L.filter(x=>x.kind==="interview").reduce((s,x)=>s+x.points,0),rf=L.filter(x=>x.kind==="ref").length,t=TI(p),bd=badges(D,a,i),nx=[20,40,60].find(v=>v>p);LINK=CFG.site+"/profile.html?n="+a.number;document.title=a.name+" — سفير NextStep AI";
$("#app").innerHTML=`<section class="box prof">${a.photo?`<img class="ph" src="${esc(a.photo)}" alt="${esc(a.name)}">`:`<div class="av">${esc((a.name||"؟").trim()[0])}</div>`}<div><span class="tag">${esc(a.number)}</span><h1 style="font-size:clamp(1.8rem,5vw,2.6rem);font-weight:900;line-height:1.35;margin:6px 0 0">${esc(a.name)}</h1><p class="sub" style="margin:0 0 8px">${esc([a.title,a.city].filter(Boolean).join(" · "))||"سفير NextStep AI"}</p><div class="chips"><span style="background:${t[1]};color:#fff">وسام ${t[0]}</span><span>المركز ${i+1} من ${r.length}</span></div>${a.bio?`<p style="margin-top:10px">${esc(a.bio)}</p>`:""}<div class="btns" style="margin-top:14px">${a.linkedin?`<a class="btn s" href="${url(a.linkedin)}" target="_blank" rel="noopener">لينكدإن ↗</a>`:""}${a.instagram?`<a class="btn s o" href="${url(a.instagram)}" target="_blank" rel="noopener">إنستغرام ↗</a>`:""}<button class="btn s o" data-a="sh">📤 مشاركة الملف</button><button class="btn s o" data-a="cp">🔗 نسخ الرابط</button></div></div></section>
<div class="stats"><div class="stat"><b>${fmt(p)}</b><small>نقطة</small></div><div class="stat"><b>#${i+1}</b><small>الترتيب</small></div><div class="stat"><b>${rf}</b><small>مستقطَب معتمد</small></div><div class="stat"><b>${iv}/50</b><small>المقابلة</small></div></div>
${nx?`<div class="box" style="margin-top:12px"><b>الوسام التالي</b><div class="bar"><i style="width:${p/nx*100}%"></i></div><small>باقٍ ${nx-p} نقطة للوسام ${TI(nx)[0]}.</small></div>`:`<div class="box" style="margin-top:12px"><b>💎 بلغ أعلى وسام</b></div>`}
<h2>🎖️ الإنجازات</h2><div class="bds">${bd.map(b=>`<div class="bd"><span style="font-size:1.6rem">${b[0]}</span>${b[1]}</div>`).join("")||`<div class="box empty" style="grid-column:1/-1">ستظهر الإنجازات هنا مع تقدّم السفير في التحدي.</div>`}</div>
<div class="cta"><b style="font-size:1.25rem">هل تريد أن تكون سفيراً أنت أيضاً؟</b><p style="opacity:.9">تابع صفحة NextStep AI وانضم إلى المجتمع.</p><a class="btn" href="${CFG.linkedinPage}" target="_blank" rel="noopener">لينكدإن</a><a class="btn" href="${CFG.whatsapp}" target="_blank" rel="noopener">مجتمع واتساب</a></div>`}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b||!A)return;if(b.dataset.a==="cp"){await navigator.clipboard.writeText(LINK).catch(()=>{});toast("نُسخ الرابط ✓")}
if(b.dataset.a==="sh"){const d={title:A.name+" — سفير NextStep AI",text:"تعرّف على السفير "+A.name+" في تحدي NextStep AI",url:LINK};if(navigator.share)navigator.share(d).catch(()=>{});else{await navigator.clipboard.writeText(LINK).catch(()=>{});toast("نُسخ الرابط ✓")}}});
init();
</script></body></html>
